<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Camera regression</title>
<button id="start">Start Web Camera</button><video autoplay muted playsinline style="width:100%"></video><pre id="status">Ready</pre>
<script>
let stream, timer;const client=new URLSearchParams(location.search).get('client')||'wk';
function report(o){o.client=client;o.secure=isSecureContext;o.time=Date.now();document.querySelector('#status').textContent=JSON.stringify(o);fetch('/report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)}).catch(()=>{});if(window.webkit?.messageHandlers?.report)window.webkit.messageHandlers.report.postMessage(o);}
async function start(){try{report({phase:'request',mediaDevices:!!navigator.mediaDevices});stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});const video=document.querySelector('video');video.srcObject=stream;await video.play();const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true}),hashes=new Set();let frames=0;timer=setInterval(()=>{try{if(!video.videoWidth)return;canvas.width=64;canvas.height=48;ctx.drawImage(video,0,0,64,48);const bytes=ctx.getImageData(0,0,64,48).data;let hash=2166136261;for(let i=0;i<bytes.length;i++)hash=Math.imul(hash^bytes[i],16777619);hashes.add(hash>>>0);frames++;report({phase:'frames',width:video.videoWidth,height:video.videoHeight,frames,unique:hashes.size,hashes:[...hashes].slice(-16)});if(frames>=12)stop();}catch(e){report({phase:'error',error:String(e)});stop();}},200);}catch(e){report({phase:'error',error:String(e),name:e.name});}}
function stop(){clearInterval(timer);stream?.getTracks().forEach(t=>t.stop());}window.stopCapture=stop;document.querySelector('#start').onclick=start;report({phase:'ready',mediaDevices:!!navigator.mediaDevices});
</script>
