name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcbeautify
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      - name: Toolchain versions
        run: |
          swift --version
          xcodebuild -version
          xcbeautify --version

      - name: Package notice regressions
        run: |
          zsh scripts/tests/stage-package-notices-tests.zsh
          zsh scripts/tests/nested-build-environment-tests.zsh
          zsh scripts/tests/package-notice-release-gate-tests.zsh
          zsh VPhoneGuestComponents/Tests/run-systemhook-camera-tests.zsh

      - name: Active display capture regressions
        run: zsh VPhoneDaemon/Tests/run-display-capture-tests.sh

      - name: Active display metrics regressions
        run: zsh VPhoneDaemon/Tests/run-display-metrics-tests.sh

      - name: Process capture pipe regressions
        run: zsh VPhoneDaemon/Tests/run-process-pipe-tests.sh

      - name: Process output capture regressions
        run: zsh VPhoneDaemon/Tests/run-process-output-tests.sh

      - name: Build VPhone.bundle
        env:
          SWIFT_JOBS: "4"
        run: |
          set -o pipefail
          mkdir -p .build
          xcodebuild -workspace VPhone.xcworkspace -scheme VPhone \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 4 build 2>&1 \
            | tee .build/xcodebuild.log \
            | xcbeautify --quiet --disable-logging --renderer github-actions

      - name: Active point geometry regressions
        run: zsh VPhoneDaemon/Tests/run-point-geometry-tests.sh --icli .build/XcodeBundle/SourcePackages/checkouts/icli

      # Quiet mode hides unannotated build-phase output, including the reason
      # a script phase failed. Keep the full log for that case.
      - name: Show raw build log
        if: failure()
        run: tail -n 300 .build/xcodebuild.log

      - name: Upload raw build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: .build/xcodebuild.log

      - name: Verify bundle
        run: |
          set -euo pipefail
          zsh VPhoneExecutable/VPhoneVirtualization/Build/ValidateBundle.sh \
            .build/XcodeBundle/Build/Products/Debug/VPhone.bundle

      - name: Device tree tests
        run: |
          set -o pipefail
          xcodebuild -workspace VPhone.xcworkspace -scheme FirmwarePatcherTests \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeBundle -jobs 2 \
            -only-testing:FirmwarePatcherTests/DeviceTreeGuestDeviceTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareDriverKitTests test 2>&1 \
            | tee .build/device-tree-tests.log \
            | xcbeautify --quiet --disable-logging --renderer github-actions

      # Xcode before 27 drops arm64e.x1 without a warning, and M6 hosts need
      # that slice of the AMFI allowlist tool.
      - name: Verify vphone-escalator slices
        run: |
          set -euo pipefail
          helper=.build/XcodeBundle/Build/Products/Debug/VPhone.bundle/Contents/MacOS/vphone-escalator
          archs=" $(lipo -archs "$helper") "
          echo "vphone-escalator:$archs"
          for arch in arm64e arm64e.x1; do
            [[ "$archs" == *" $arch "* ]] || { echo "::error::vphone-escalator lacks $arch"; exit 1; }
          done

      - name: Host health probe tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-health-probe-tests.sh

      - name: Host orientation hold tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-orientation-hold-tests.sh

      - name: Host mouse mode tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-mouse-mode-tests.sh

      - name: Host HTTP read tests
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-http-read-tests.sh

      - name: Test host shell relay
        run: zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-host-shell-relay-tests.sh

      - name: RPC error relay and daemon logic tests
        run: |
          set -euo pipefail
          zsh VPhoneExecutable/VPhoneVirtualization/Tests/run-rpc-error-relay-tests.sh
          zsh VPhoneDaemon/Tests/run-logic-tests.sh
          zsh VPhoneDaemon/Tests/run-rpc-compatibility-tests.zsh

      - name: Guest health and process capture tests
        run: |
          set -euo pipefail
          zsh VPhoneDaemon/Tests/run-health-tests.sh
          zsh VPhoneDaemon/Tests/run-process-pipe-tests.sh
          zsh VPhoneDaemon/Tests/run-process-output-tests.sh
          zsh VPhoneDaemon/Tests/run-cached-binary-identity-tests.sh
          zsh VPhoneDaemon/Tests/run-cached-binary-confirmation-tests.sh

      - name: Recovery client cleanup tests
        run: zsh VPhoneExecutable/VPhoneCommand/VPhoneRestore/VPhoneRestoreTests/run-recovery-client-tests.sh

      - name: Check RPC result schemas
        run: |
          set -euo pipefail
          icli="$PWD/.build/XcodeBundle/SourcePackages/checkouts/icli"
          zsh VPhoneDaemon/Tests/run-methods-tests.sh
          zsh VPhoneDaemon/Tests/run-methods-tests.sh --self-test
          zsh VPhoneDaemon/Tests/run-methods-live-stub-tests.sh
          RS_ICLI="$icli" zsh VPhoneDaemon/Tests/run-result-schema-runner-tests.sh
          RS_ICLI="$icli" zsh VPhoneDaemon/Tests/run-result-schema-tests.sh --jobs 4
          zsh VPhoneDaemon/Tests/run-result-schema-check.sh --icli "$icli"

      - name: CoreKit template reboot and API gate tests
        run: |
          set -euo pipefail
          xcodebuild -project VPhoneKit/VPhoneKit.xcodeproj -scheme VPhoneCoreKitTests \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeCoreTests \
            -clonedSourcePackagesDirPath .build/XcodeBundle/SourcePackages \
            -disableAutomaticPackageResolution -parallel-testing-enabled NO -jobs 4 test \
            -only-testing:VPhoneCoreKitTests/TemplateSetupBootTests \
            -only-testing:VPhoneCoreKitTests/APIRequestGateTests \
            -only-testing:VPhoneCoreKitTests/PCCGPUDriverTests \
            -only-testing:VPhoneCoreKitTests/PCCCryptexctlTests \
            -only-testing:VPhoneCoreKitTests/FirmwareCatalogReportTests \
            -only-testing:VPhoneCoreKitTests/GuestDeviceTests

      - name: Dyld mapping lifetime and undo tests
        run: |
          set -euo pipefail
          xcodebuild -workspace VPhone.xcworkspace -scheme FirmwarePatcherTests \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeCommandTests \
            -clonedSourcePackagesDirPath .build/XcodeBundle/SourcePackages \
            -disableAutomaticPackageResolution -parallel-testing-enabled NO -jobs 4 test \
            -only-testing:FirmwarePatcherTests/DyldSharedCacheMappingLifetimeTests \
            -only-testing:FirmwarePatcherTests/DyldSharedCacheArm64eX1BootstrapTests \
            -only-testing:FirmwarePatcherTests/DyldSharedCacheUndoLogTests \
            -only-testing:FirmwarePatcherTests/DyldSharedCacheUndoWordsTests \
            -only-testing:FirmwarePatcherTests/DyldSharedCacheOutdatedImplementationTests

      - name: Standalone patches and selection migration tests
        run: |
          set -euo pipefail
          xcodebuild -workspace VPhone.xcworkspace -scheme FirmwarePatcherTests \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath .build/XcodeCommandTests \
            -clonedSourcePackagesDirPath .build/XcodeBundle/SourcePackages \
            -disableAutomaticPackageResolution -parallel-testing-enabled NO -jobs 4 test \
            -only-testing:FirmwarePatcherTests/DeviceTreeGuestDeviceTests \
            -only-testing:FirmwarePatcherTests/SPTMSecondaryCPUTests \
            -only-testing:FirmwarePatcherTests/CryptexTrustedDarwinOSTests \
            -only-testing:FirmwarePatcherTests/TrustCacheTests \
            -only-testing:FirmwarePatcherTests/FirmwareManifestSelectionTests \
            -only-testing:FirmwarePatcherTests/FirmwarePatchDriftTests \
            -only-testing:FirmwarePatcherTests/DyldSharedCacheQuartzCoreUnrotatedFramebufferTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareDriverKitTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareRemotePairingTests \
            -only-testing:FirmwarePatcherTests/FirmwareGuestPatchResolutionTests \
            -only-testing:FirmwarePatcherTests/FirmwarePatchSetCatalogTests \
            -only-testing:FirmwarePatcherTests/FirmwarePatchSelectionCompatibilityTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareArm64eX1Tests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareArm64eX1InstallationTests \
            -only-testing:FirmwarePatcherTests/CustomFirmwareArm64eX1AuditTests \
            -only-testing:FirmwarePatcherTests/FirmwareAccessibilityPatchTests \
            -only-testing:FirmwarePatcherTests/FirmwareDebugLibraryPatchTests \
            -only-testing:FirmwarePatcherTests/TXMExecutableRemapTests \
            -only-testing:FirmwarePatcherTests/TXMMissingProfileTests
          node Research/Integration/duo_m5_20261030/Regression/test-patch-selection-cli.mjs \
            .build/XcodeBundle/Build/Products/Debug/VPhone.bundle/Contents/MacOS/vphone-cli \
            .build/patch-selection-cli-ci
          zsh VPhoneLaunchpad/Tests/BundleNamesTests.sh

      - name: Guest display and point input tests
        run: |
          set -euo pipefail
          zsh VPhoneDaemon/Tests/run-display-layout-tests.sh
          zsh VPhoneDaemon/Tests/run-display-metrics-tests.sh
          zsh VPhoneDaemon/Tests/run-display-capture-tests.sh
          zsh VPhoneDaemon/Tests/run-point-geometry-tests.sh
          zsh VPhoneDaemon/Tests/run-element-tap-tests.sh
          zsh VPhoneDaemon/Tests/run-render-server-lifecycle-tests.zsh
          zsh Research/Integration/duo_m5_20261030/Regression/test-runtime-cleanup.zsh
          node Research/Integration/duo_m5_20261030/Regression/test-display-marker-pixels.mjs
          node Research/Integration/duo_m5_20261030/Regression/test-followup-evidence.mjs

      - name: Guest component tests
        run: |
          make -C VPhoneGuestComponents test-mach-ports-compat
          make -C VPhoneGuestComponents test-x1-task-exceptions
          make -C VPhoneGuestComponents test-ios16-surface
          make -C VPhoneGuestComponents test-ios18-gpu
          make -C VPhoneGuestComponents test-ios16-lab-policy
          make -C VPhoneGuestComponents test-loader-links
          make -C VPhoneGuestComponents test-vcam-dataplane
          make -C VPhoneGuestComponents test-vcam-prewarm
          make -C VPhoneGuestComponents test-vcam-drive-gate
          make -C VPhoneGuestComponents test-camfix-geometry
          make -C VPhoneGuestComponents test-camfix-session-reference
          make -C VPhoneGuestComponents test-fold-display-samples
          make -C VPhoneGuestComponents test-fold-display-wake
          make -C VPhoneGuestComponents test-fold-display-panel-power
